<!DOCTYPE html>
<html lang="en" class="h-full">
    <head>
        <title>Resume</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Patricia Sunday">
        <meta name="description" content="Resume page for portfolio">
        <meta name="keywords" content="resume, cv, portfolio, programming">
        <link rel="stylesheet" href="../styles/output.css">
        <script src="../scripts/components.js" defer></script>
    </head>
    <body class="min-h-full flex flex-col text-[var(--text-color)]">
        <!--hero section-->
        <header class="relative h-64 flex flex-col">
            <img src="../media/profile-background.jpg" alt="Low-angle photo of a tall tree on a sunny day" class="absolute inset-0 w-full h-full object-cover"> <!--see components.js for injected html-->
            <div class="absolute inset-0 bg-black/40"></div>
            <div class="relative z-10 flex flex-col h-full text-white">
                <div class="self-center pt-6"><div id="nav-placeholder"></div></div> <!--see components.js for injected html-->
                <div class="grow flex flex-col justify-center items-center gap-2 text-center px-8">
                    <h1 class="text-4xl font-bold">My Resume</h1>
                    <p class="text-lg font-medium opacity-85">2nd-Year Student &middot; Full-Stack Developer &middot; Ottawa, ON</p>
                </div>
            </div>
        </header>
        <main class="grow flex flex-col items-center px-12 md:px-24 py-12 gap-6">
            <!--toolbar: download-->
            <div class="w-full max-w-4xl flex justify-between items-center">
                <p class="text-sm opacity-60">Available for internship</p>
                <a href="../media/resume.pdf" download class="px-8 py-3 rounded-full bg-[var(--accent-color)] text-[var(--text-color)] font-bold text-sm hover:opacity-80 active:scale-95 transition-all">Download</a>
            </div>
            <!--pdf viewer-->
            <div class="w-full max-w-4xl grow rounded-2xl border border-[var(--text-color)]/10" style="box-shadow: 0 4px 24px color-mix(in srgb, var(--primary-contrast) 30%, transparent); min-height: 80vh; overflow: hidden; isolation: isolate;">
                <iframe src="../media/resume.pdf#toolbar=0&navpanes=0" class="w-full h-full rounded-2xl" style="min-height: 80vh; display: block;" title="Resume preview"></iframe>
            </div>
        </main>
        <div id="footer-placeholder"></div> <!--see components.js for injected html-->
    </body>
</html>
